services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: supplychain-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: supplychain-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/Password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: